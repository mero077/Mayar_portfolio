<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayar Alalwan - Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/style.css">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
  <main class="hero">
    <div class="stage">
    <svg class="flower" viewBox="-100 -100 200 200" role="img" aria-label="A pink flower with a yellow center, slowly turning">
      <g class="spin">
        <g fill="var(--petal)" stroke="var(--petal-edge)" stroke-width="1.5">
          <ellipse cx="0" cy="-46" rx="24" ry="40"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(45)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(90)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(135)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(180)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(225)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(270)"/>
          <ellipse cx="0" cy="-46" rx="24" ry="40" transform="rotate(315)"/>
        </g>
        <circle r="26" fill="var(--core)"/>
        <g fill="var(--core-dot)">
          <circle cx="0" cy="-11" r="2.6"/>
          <circle cx="10" cy="-4" r="2.6"/>
          <circle cx="7" cy="9" r="2.6"/>
          <circle cx="-7" cy="9" r="2.6"/>
          <circle cx="-10" cy="-4" r="2.6"/>
          <circle cx="0" cy="1" r="2.6"/>
        </g>
      </g>
    </svg>
    <div class="intro">
      <h1>Mayar<br>Alalwan</h1>
      <p class="role">Software Engineer</p>
    </div>
    </div>

    <section class="about">
      <svg class="vine" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="bellfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--bell-a)"/>
            <stop offset="1" style="stop-color:var(--bell-b)"/>
          </linearGradient>
          <g id="bell">
            <path d="M-5 -17 L5 -17 L3 -28 L-3 -28Z" fill="var(--cap)"/>
            <path d="M-16 -2 C-16 -24 16 -24 16 -2 C16 14 24 24 27 31 L-27 31 C-24 24 -16 14 -16 -2Z" fill="url(#bellfill)"/>
          </g>
          <path id="heart" d="M0 18 C-30 -2 -22 -26 0 -10 C22 -26 30 -2 0 18Z" fill="var(--leaf)"/>
        </defs>
        <g fill="none" stroke="var(--vine)" stroke-width="6" stroke-linecap="round">
          <path d="M120 920 C60 760 260 700 200 560 S140 380 230 260 S240 80 210 -20"/>
          <path stroke-width="4" d="M230 260 C330 200 380 120 330 80 C300 55 270 90 295 112"/>
          <path stroke-width="4" d="M150 410 C60 380 20 300 70 270 C100 255 125 285 105 302"/>
          <path stroke-width="4" d="M205 570 C300 560 360 640 320 690 C295 712 265 690 285 705"/>
          <path stroke-width="4" d="M150 770 C80 750 50 820 100 842"/>
        </g>
        <use href="#bell" transform="translate(295 140) scale(1.1)"/>
        <use href="#bell" transform="translate(105 330) scale(1.2)"/>
        <use href="#bell" transform="translate(285 733) scale(1)"/>
        <use href="#bell" transform="translate(100 870) scale(0.9)"/>
        <use href="#heart" transform="translate(160 650) rotate(-35) scale(1.5)"/>
        <use href="#heart" transform="translate(245 500) rotate(40) scale(1.3)"/>
        <use href="#heart" transform="translate(185 420) rotate(-40) scale(1.4)"/>
        <use href="#heart" transform="translate(250 290) rotate(35) scale(1.2)"/>
        <use href="#heart" transform="translate(195 130) rotate(-30) scale(1.3)"/>
        <use href="#heart" transform="translate(130 800) rotate(-20) scale(1.2)"/>
      </svg>
      <div class="about-text">
        <p class="lead">Software Engineering student fascinated by how technology works and what we can create with it.</p>
        <p>Whether it’s developing software, exploring new technologies, or flying FPV drones, I’m driven by curiosity and the excitement of creating something new.</p>
      </div>
    </section>
  </main>
</body>
</html>
